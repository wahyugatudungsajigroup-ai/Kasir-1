<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c63bf">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Kasirku</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar + content (desktop), bottom tab bar (phone). Kasir = menu grid + order rail / bottom sheet. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb;
  --ink:#0e1726; --ink-2:#4b576a; --ink-3:#66728a;
  --line:#dde3ec; --line-2:#c5cdda;
  --accent:#1c63bf; --accent-ink:#ffffff; --accent-soft:#e4eefb;
  --s1:#2a78d6; --s2:#eb6834;
  --ok:#0a7a3a; --ok-bg:#e1f4e8; --warn:#8a5a00; --warn-bg:#fdf0d2; --bad:#b92b29; --bad-bg:#fbe4e3;
  --shadow:0 10px 34px rgb(14 23 38 / .16);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c111a; --surface:#141b27; --surface-2:#1a2331;
    --ink:#eaf0f8; --ink-2:#aab6c7; --ink-3:#8793a6;
    --line:#243044; --line-2:#33425a;
    --accent:#5a9df0; --accent-ink:#06121f; --accent-soft:#16283f;
    --s1:#3987e5; --s2:#d95926;
    --ok:#42d17b; --ok-bg:#12301f; --warn:#f0b53a; --warn-bg:#352a0f; --bad:#f2706d; --bad-bg:#3a1a1b;
    --shadow:0 10px 34px rgb(0 0 0 / .5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c111a; --surface:#141b27; --surface-2:#1a2331;
  --ink:#eaf0f8; --ink-2:#aab6c7; --ink-3:#8793a6;
  --line:#243044; --line-2:#33425a;
  --accent:#5a9df0; --accent-ink:#06121f; --accent-soft:#16283f;
  --s1:#3987e5; --s2:#d95926;
  --ok:#42d17b; --ok-bg:#12301f; --warn:#f0b53a; --warn-bg:#352a0f; --bad:#f2706d; --bad-bg:#3a1a1b;
  --shadow:0 10px 34px rgb(0 0 0 / .5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
small,.muted{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.r{text-align:right}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn.big{min-height:50px;font-size:16px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.icon{display:inline-grid;place-items:center;width:34px;height:34px;border:0;background:transparent;border-radius:8px;color:var(--ink-2)}
.icon:hover{background:var(--surface-2)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--ink-2)}
label.f>span.h{font-weight:400;font-size:12px;color:var(--ink-3)}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.chk input{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stack{display:grid;gap:12px}

/* segmented + chips */
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:6px;padding:18px 12px;background:var(--surface);border-right:1px solid var(--line);min-height:0}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:700 20px var(--display)}
.brand b{display:block;font:700 16px var(--display);line-height:1.15}
.brand small{font-size:12px}
.side nav{display:grid;gap:2px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);text-align:left}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line)}
.me div:nth-child(2){flex:1;min-width:0}
.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none}
.store{padding:0 8px;font-size:12px;color:var(--ink-3)}
.main{overflow-y:auto;padding:22px 24px 40px;min-width:0}
.tabbar{display:none}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font:700 26px/1.15 var(--display);letter-spacing:-.01em}
.ph p{color:var(--ink-3);margin-top:2px}
.sec{margin-top:22px}
.sec>h2{font:700 16px var(--display);margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.empty{padding:34px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:14px;background:var(--surface)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line-2)}
td.nw{white-space:nowrap}
.sub{display:block;font-size:12px;color:var(--ink-3)}
tr.void td{color:var(--ink-3);text-decoration:line-through}
tr.void td:last-child{text-decoration:none}
.bar{display:block;height:6px;border-radius:3px;background:var(--surface-2);min-width:70px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--s1);border-radius:3px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile small{display:block;font-size:12px;font-weight:600}
.tile b{display:block;font:700 22px/1.2 var(--display);margin-top:4px;overflow-wrap:anywhere}
.tile .d{font-size:12px;margin-top:2px;color:var(--ink-3)}
.up{color:var(--ok)} .dn{color:var(--bad)}
.pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.pick .lbl{font:700 15px var(--display);min-width:140px;text-align:center}
.pick input[type=date]{width:auto}

/* charts */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.sc{overflow-x:auto}
.sc svg{display:block;max-width:none}
.gl{stroke:var(--line)} .bl{stroke:var(--line-2)} .ax{fill:var(--ink-3);font-size:11px}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;max-width:240px;box-shadow:var(--shadow)}
.hb{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.hb .bar{height:10px}
.mx td,.mx th{padding:7px 8px;text-align:center;font-size:12.5px;white-space:nowrap}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;min-width:140px;border-right:1px solid var(--line)}
.mx th:first-child{background:var(--surface-2)}
.mx td.z{color:var(--ink-3)}

/* login + setup */
.center{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
.card.wide{max-width:520px}
.card h1{font:700 24px/1.2 var(--display);margin:14px 0 4px}
.users{display:grid;gap:8px;margin:16px 0}
.ubtn{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.ubtn.on{border-color:var(--accent);background:var(--accent-soft)}
.ubtn b{display:block}
.ubtn small{display:block}
.splash{min-height:100%;display:grid;place-items:center;color:var(--ink-3);text-align:center;padding:24px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.pos-l{display:grid;gap:12px;min-width:0}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:0 12px}
.search input{border:0;min-height:44px;padding:0;background:transparent}
.search input:focus-visible{outline:none}
.search:focus-within{outline:2px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;min-height:96px;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.item:hover{border-color:var(--accent)}
.item .cat{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.item b{font-weight:600;line-height:1.25}
.item .price{margin-top:auto;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.item .stk{font-size:11.5px;color:var(--ink-3)} .item .stk.low{color:var(--bad);font-weight:700}
.item.out{opacity:.5;cursor:not-allowed}
.badge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;display:grid;place-items:center}
.cart{position:sticky;top:0;display:flex;flex-direction:column;max-height:calc(100dvh - 44px);background:var(--surface);border:1px solid var(--line);border-radius:16px}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h2{font:700 17px var(--display)}
.ch .sp{flex:1}
.only-m{display:none}
.lines{overflow-y:auto;min-height:90px;padding:6px 16px}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln b{font-weight:600;display:block}
.ln small{display:block}
.step{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px}
.step button{width:30px;height:30px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.step span{min-width:26px;text-align:center;font-weight:700}
.cf{padding:12px 16px 16px;border-top:1px solid var(--line);display:grid;gap:10px;overflow-y:auto}
.disc{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center}
.disc input{min-height:36px}
.sum{display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font:700 22px var(--display);padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:600;font-size:12.5px}
.chg{display:flex;justify-content:space-between;font-weight:700}
.fab{display:none}

/* modal + toast */
#modal:empty{display:none}
.ov{position:fixed;inset:0;z-index:50;background:rgb(8 12 20 / .55);display:grid;place-items:center;padding:16px}
.dlg{width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.dlg.wide{max-width:720px}
.dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dh h2{font:700 18px var(--display);flex:1}
.db{padding:16px 18px;display:grid;gap:14px}
.df{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 16px;flex-wrap:wrap}
.rc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:14px}
.rc .ctr{text-align:center}
.rc .l{display:flex;justify-content:space-between;gap:10px}
.rc hr{border:0;border-top:1px dashed var(--line-2);margin:8px 0}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:var(--surface-2);border-radius:12px;padding:12px}
.calc small{display:block}
.calc b{font:700 17px var(--display)}
.rrow{display:grid;grid-template-columns:minmax(0,1.6fr) 90px minmax(70px,.8fr) 34px;gap:8px;align-items:center;margin-bottom:8px}
.note{padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.note.info{background:var(--accent-soft);color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600}
.toast.err{background:var(--bad);color:#fff}
[hidden]{display:none!important}

@media (max-width:980px){
  .pos{grid-template-columns:1fr}
  .cart{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:40;max-height:88dvh;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .2s;box-shadow:var(--shadow)}
  .pos.open .cart{transform:none}
  .only-m{display:inline-grid}
  .fab{display:flex;position:fixed;left:16px;right:16px;bottom:78px;z-index:30;justify-content:space-between;align-items:center;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:0 18px;font-weight:700;box-shadow:var(--shadow)}
}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{display:none}
  .main{padding:16px 16px 24px}
  .tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:8px 0;font-size:10px;font-weight:600;color:var(--ink-3);min-width:0}
  .tabbar button.on{color:var(--accent)}
  .tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ph h1{font-size:22px}
  .cols2,.cols3{grid-template-columns:1fr}
  .fab{bottom:74px}
}
/* imagery: logo, product photos, hero */
.logo{overflow:hidden}
.logo.has{background:var(--surface);border:1px solid var(--line)}
.lg{width:100%;height:100%;object-fit:contain;display:block}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block;background:var(--surface-2)}
.item{display:block;padding:0;min-height:0;overflow:hidden;text-align:left}
.item .im-btn{display:flex;flex-direction:column;width:100%;border:0;background:transparent;padding:0;text-align:left;color:inherit}
.item .im{display:block;aspect-ratio:4/3;overflow:hidden;background:var(--surface-2)}
.item .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.item:hover .im img{transform:scale(1.04)}
.item .tx{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.item .tx .price{margin-top:4px}
.item .info{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;border:0;display:grid;place-items:center;background:rgb(255 255 255 / .92);color:#0e1726;font:700 14px var(--display);box-shadow:0 1px 4px rgb(0 0 0 / .25)}
.item.out .im img{filter:grayscale(1)}
.item .im-btn[disabled]{cursor:not-allowed}
.grid.list{grid-template-columns:1fr}
.grid.list .im-btn{flex-direction:row;align-items:center;gap:12px}
.grid.list .im{width:76px;aspect-ratio:1;flex:none}
.grid.list .tx{padding:8px 48px 8px 0;flex:1}
.grid.list .info{top:50%;left:auto;right:10px;transform:translateY(-50%)}
.grid.list .badge{top:8px;right:46px}
.ln{grid-template-columns:44px minmax(0,1fr) auto auto}
.pd-img{aspect-ratio:16/10;overflow:hidden;background:var(--surface-2)}
.pd-img img{width:100%;height:100%;object-fit:cover;display:block}
.photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo img{width:104px;height:78px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);outline:2px solid var(--line-2);display:grid;place-items:center;color:#fff;padding:0}
.sw.on{outline-color:var(--ink)}
.logo-up{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-up .logo{width:76px;height:76px;border-radius:18px;font-size:32px}
.share{display:grid;gap:10px}
.btn.wa{background:#1b9e4e;border-color:#1b9e4e;color:#fff;text-decoration:none}
.btn.wa:hover{background:#18903f}
.split{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:40px;color:#fff;background:linear-gradient(155deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000))}
.hero>*{position:relative;z-index:1}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgb(255 255 255 / .07)}
.hero::before{width:420px;height:420px;right:-140px;top:-120px}

function makeFbDB(db) {
  const snapDoc = s => ({ id: s.id, exists: s.exists, data: () => s.data() });
  const doc = path => {
    const r = db.doc(path);
    return {
      path, id: r.id,
      get: async () => snapDoc(await r.get()),
      set: d => r.set(d).catch(e => { throw fbErr(e); }),
      update: d => r.set(d, { merge: true }).catch(e => { throw fbErr(e); }),
      delete: () => r.delete().catch(e => { throw fbErr(e); }),
      onSnapshot: (fn, err) => r.onSnapshot(s => fn(snapDoc(s)), e => { if (err) err(fbErr(e)); })
    };
  };
  const collection = path => {
    const c = db.collection(path);
    return { path, doc: id => doc(path + '/' + id), onSnapshot: (fn, err) => c.onSnapshot(q => fn({ docs: q.docs.map(snapDoc), size: q.size, empty: q.empty }), e => { if (err) err(fbErr(e)); }) };
  };
  return { doc, collection };
}

function hppOf(p, B) {

function derive() {
  const all = [];
  for (const dk in S.days) { const o = S.days[dk] || {}; for (const id in o) { const t = o[id]; if (t && Array.isArray(t.items)) all.push(t); } }

  const sold = {};

  for (const id in S.products) { const p = S.products[id]; if (p.track) S.stock[id] = (+p.stok || 0) - (sold[id] || 0); }

}

function agg(list) {
  const a = { n: list.length, omzet: 0, hpp: 0, qty: 0, diskon: 0, pajak: 0 };
  list.forEach(t => { a.omzet += t.sub - t.diskon; a.diskon += t.diskon; a.pajak += t.pajak; t.items.forEach(i => { a.hpp += i.qty * i.hpp; a.qty += i.qty; }); });
  a.laba = a.omzet - a.hpp; a.margin = a.omzet > 0 ? a.laba / a.omzet * 100 : 0; a.avg = a.n ? a.omzet / a.n : 0;
  return a;
}
function itemAgg(list) {
  const m = {};
  list.forEach(t => {
    const r = t.sub > 0 ? (t.sub - t.diskon) / t.sub : 1;
    t.items.forEach(i => {
      const o = m[i.pid] || (m[i.pid] = { pid: i.pid, nama: i.nama, kat: (S.products[i.pid] && S.products[i.pid].kategori) || '-', qty: 0, net: 0, cost: 0 });
      o.nama = i.nama; o.qty += i.qty; o.net += i.qty * i.harga * r; o.cost += i.qty * i.hpp;
    });
  });
  return Object.values(m).map(o => Object.assign(o, { laba: o.net - o.cost, margin: o.net > 0 ? (o.net - o.cost) / o.net * 100 : 0 }));
}
function totals() {
  const c = cfg(); let sub = 0;
  S.cart.forEach(l => { const p = S.products[l.pid]; if (p) sub += p.harga * l.qty; });
  let dis = S.pay.diskonT === 'pct' ? sub * (+S.pay.diskonV || 0) / 100 : (+S.pay.diskonV || 0);
  dis = Math.max(0, Math.min(sub, Math.round(dis)));

function fileToDataURL(file, max, q, png) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const im = new Image(); im.onerror = () => rej(new Error('img'));
      im.onload = () => {
        const r = Math.min(1, max / Math.max(im.width, im.height)); const w = Math.max(1, Math.round(im.width * r)), h = Math.max(1, Math.round(im.height * r));
        const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
        if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); }
        x.drawImage(im, 0, 0, w, h); res(c.toDataURL(png ? 'image/png' : 'image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function posAdd(id, d) {
  const p = S.products[id]; if (!p || !p.aktif) return;
  const l = S.cart.find(x => x.pid === id); const cur = l ? l.qty : 0;
  if (d > 0 && p.track && cur + d > S.stock[id]) return toast('Stok ' + p.nama + ' tidak cukup', 'err');
  if (l) { l.qty += d; if (l.qty <= 0) S.cart = S.cart.filter(x => x.pid !== id); }
  else if (d > 0) S.cart.push({ pid: id, qty: 1 });
  posCart(); posGrid();
}
async function doPay() {
  const t = totals(); if (!S.cart.length) return;
  if (S.pay.metode === 'Tunai' && t.bayar < t.total) return toast('Uang diterima masih kurang', 'err');
  const now = Date.now(), dk = dKey(now), n = Object.keys(S.days[dk] || {}).length + 1;
  const items = S.cart.map(l => { const p = S.products[l.pid]; return { pid: p.id, nama: p.nama, qty: l.qty, harga: p.harga, hpp: Math.round(hppOf(p)) }; });
  const trx = { id: uid(), no: 'INV-' + dk.slice(2).replace(/-/g, '') + '-' + pad(n, 3), ts: now, kasirId: S.me.id, kasir: S.me.nama, items, sub: t.sub, diskon: t.dis, pajak: t.pj, total: t.total, metode: S.pay.metode, bayar: t.bayar, kembali: Math.max(0, t.kembali) };
  $('#payBtn').disabled = true;
  try {
    const w = upsert('sales/' + dk, 'trx', trx.id, trx); w.catch(() => {});
    const r = await Promise.race([w.then(() => 'ok'), sleep(3500).then(() => 'queued')]);
    if (r === 'queued') toast('Transaksi disimpan di perangkat dan akan terkirim saat internet kembali');
  } catch (e) { posSum(); return toast('Transaksi belum tersimpan. Periksa izin akses atau koneksi.', 'err'); }
  S.cart = []; S.pay.diskonV = ''; S.pay.bayar = '';
  $('#disc').value = ''; $('#bayar').value = '';
  const pos = $('#pos'); if (pos) pos.classList.remove('open');
  posCart(); posGrid(); showReceipt(trx);
}

function salesFiltered() {
  const u = S.ui; const q = u.sq.trim().toLowerCase();
  return S.all.filter(t => {
    const dk = dKey(t.ts);
    if (dk < u.sf || dk > u.st) return false;
    if (!can('cost') && t.kasirId !== S.me.id) return false;
    if (u.sm !== 'all' && t.metode !== u.sm) return false;
    if (u.sk !== 'all' && t.kasirId !== u.sk) return false;
    if (u.ss === 'ok' && t.void) return false;
    if (u.ss === 'void' && !t.void) return false;
    if (q && !(t.no.toLowerCase().includes(q) || (t.kasir || '').toLowerCase().includes(q) || t.items.some(i => i.nama.toLowerCase().includes(q)))) return false;
    return true;
  });
}

async function createAuthUser(email, pass) {
  let sec; try { sec = firebase.app('sec'); } catch (e) { sec = firebase.initializeApp(FB_CONFIG, 'sec'); }
  const cred = await sec.auth().createUserWithEmailAndPassword(email, pass);
  const uid = cred.user.uid; await sec.auth().signOut(); return uid;
}
async function saveUser(id) {
  const nama = $('#un').value.trim(), role = $('#ur').value, aktif = $('#ua').checked;
  if (!nama) return toast('Isi nama pengguna', 'err');
  const supers = Object.values(S.users).filter(u => u.role === 'superadmin' && u.aktif && u.id !== id);
  if (id && S.users[id].role === 'superadmin' && (role !== 'superadmin' || !aktif) && !supers.length) return toast('Harus ada minimal satu Super Admin aktif', 'err');
  try {
    if (id) { await upsertProfile(id, Object.assign({}, S.users[id], { nama, role, aktif })); }
    else {
      const email = $('#ue').value.trim().toLowerCase(), pass = $('#up').value;
      if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Format email belum benar', 'err');
      if (pass.length < 6) return toast('Kata sandi minimal 6 karakter', 'err');
      const uidn = await createAuthUser(email, pass);
      await upsertProfile(uidn, { id: uidn, nama, email, role, aktif });
    }
  } catch (e) {
    const c = e && e.code;
    return toast(c === 'auth/email-already-in-use' ? 'Email itu sudah terdaftar' : c === 'auth/weak-password' ? 'Kata sandi terlalu lemah' : c === 'auth/network-request-failed' ? 'Tidak ada koneksi internet' : 'Gagal menyimpan pengguna', 'err');
  }
  closeModal(); toast('Pengguna disimpan');
}
async function upsertProfile(uid, p) { await DB.doc('profiles/' + uid).set(p); S.users[uid] = p; }
async function resetPw(id) {
  const u = S.users[id]; if (!u || !u.email) return;

    <div class="db"><div class="note">${sales ? 'Seluruh riwayat penjualan dan laporan akan hilang dan tidak bisa dikembalikan.' : 'Semua produk, resep, dan bahan baku akan hilang. Riwayat transaksi tetap ada.'}</div>
    <label class="f">Ketik HAPUS untuk melanjutkan<input id="wp" type="text" autocomplete="off"></label></div>
    <div class="df"><button class="btn" data-act="close">Batal</button><button class="btn danger" data-act="wipe-do" data-w="${w}">Hapus permanen</button></div>`);
}
async function doWipe(w) {
  if ($('#wp').value.trim() !== 'HAPUS') return toast('Ketik HAPUS dengan huruf besar', 'err');
  closeModal(); S.busy = 'Menghapus data…'; render();
  try {
    if (w === 'sales') { for (const dk of Object.keys(S.days)) await retry(() => DB.doc('sales/' + dk).delete()); }
    else { await DB.doc('master/products').set({ items: {} }); await DB.doc('master/bahan').set({ items: {} }); }
  } catch (e) { toast('Sebagian data gagal dihapus', 'err'); }
  S.busy = ''; derive(); render(); toast('Data dihapus');
}
/* ---------- events ---------- */
const H = {
  nav: el => { S.route = el.dataset.r; renderShell(); const v = $('#view'); if (v) v.scrollTop = 0; },
  logout: () => logout(),
  setup: el => doSetup(el.dataset.demo === '1'),
  close: () => { closeModal(); if (S.route !== 'pos') renderViewKeep(); },
  'cart-open': () => $('#pos').classList.add('open'),
  'cart-close': () => $('#pos').classList.remove('open'),
  'pos-clear': () => { S.cart = []; posCart(); posGrid(); },
  'pos-dt': el => { S.pay.diskonT = el.dataset.t; posCart(); },
  'pos-cat': el => { S.cat = el.dataset.c; posGrid(); },
  'pos-add': el => posAdd(el.dataset.id, 1),
  'pos-inc': el => posAdd(el.dataset.id, 1),
  'pos-dec': el => posAdd(el.dataset.id, -1),
  'pos-metode': el => { S.pay.metode = el.dataset.m; posCart(); },

  'pos-pay': () => doPay(),
  'copy-receipt': () => {

  },
  'rc-png': async () => {

      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Struk ' + t.no }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
      await S.dl.save({ filename: file.name, data: blob });
    } catch (e) { toast('Gagal membuat gambar struk', 'err'); }
  },
  'rc-txt': async () => {
    const t = S.rcTrx || S.lastTrx; if (!t) return;
    if (!S.dl) return toast('Unduh tidak tersedia di tampilan ini', 'err');
    try { await S.dl.save({ filename: 'struk-' + t.no + '.txt', data: receiptText(t) }); } catch (e) { if (!e || e.code !== 'declined') toast('Gagal mengunduh struk', 'err'); }
  },
  'bt-help': () => btHelpModal(),
  'bt-print': async el => {

      else if (c === 'nochar') toast('Printer ini tidak bisa dipakai lewat browser. Pakai Gambar struk dan aplikasi cetak.', 'err');
      else toast('Gagal mencetak. Pastikan printer menyala dan berjenis BLE.', 'err');
    }
    if (b) { b.disabled = false; b.textContent = 'Cetak Bluetooth'; }
  },
  'user-reset': el => resetPw(el.dataset.id),
  'pos-pv': el => { S.pv = el.dataset.v; $('#pvseg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === S.pv)); posGrid(); },
  'pos-info': el => prodInfo(el.dataset.id),
  'pos-add-close': el => { posAdd(el.dataset.id, 1); closeModal(); },
  'pimg-rm': () => { M.img = null; const p = S.products[M.pid] || {}; $('#pimg').src = artURI($('#pk').value || p.kategori || '', $('#pn').value || 'Produk'); },
  'logo-rm': async () => { try { await DB.doc('img/logo').delete(); toast('Logo dihapus'); } catch (e) { toast('Gagal menghapus logo', 'err'); } },
  accent: async el => { await patchSettings({ aksen: el.dataset.k }); renderShell(); },
  'sale-open': el => saleModal(el.dataset.id, el.dataset.d),
  'void-ask': el => saleModal(el.dataset.id, el.dataset.d, true),
  'void-do': el => doVoid(el.dataset.id, el.dataset.d),
  'export-sales': () => { if (S.lastCsv) exportCSV(S.lastCsv.name, S.lastCsv.rows); },
  'export-rep': () => { if (S.lastCsv) exportCSV(S.lastCsv.name, S.lastCsv.rows); else toast('Belum ada data untuk diunduh', 'err'); },
  'rep-tab': el => { S.ui.rep = el.dataset.t; renderViewKeep(); },
  'rep-prev': () => { const u = S.ui; if (u.rep === 'harian' || u.rep === 'itemd') u.date = shiftD(u.date, -1); else u.month = shiftM(u.month, -1); renderViewKeep(); },
  'rep-next': () => { const u = S.ui; if (u.rep === 'harian' || u.rep === 'itemd') u.date = shiftD(u.date, 1); else u.month = shiftM(u.month, 1); renderViewKeep(); },
  'rep-now': () => { S.ui.date = TODAY; S.ui.month = TODAY.slice(0, 7); renderViewKeep(); },
  'rep-mx': el => { S.ui.mx = el.dataset.v; repBody(); },
  'prod-tab': el => { S.prodTab = el.dataset.t; renderViewKeep(); },
  'prod-new': () => prodModal(''),
  'prod-edit': el => prodModal(el.dataset.id),
  pmode: el => { $('#pmode').value = el.dataset.m; el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); calcBox(); },
  'rrow-add': () => { M.resep.push({ b: '', q: '' }); renderResep(); calcBox(); },
  'rrow-rm': el => { M.resep.splice(+el.dataset.i, 1); renderResep(); calcBox(); },
  'prod-save': () => saveProduct(),
  'bahan-new': () => bahanModal(''),
  'bahan-edit': el => bahanModal(el.dataset.id),
  'bahan-save': () => saveBahan(),
  'bahan-del': el => delBahan(el.dataset.id),
  'user-new': () => userModal(''),
  'user-edit': el => userModal(el.dataset.id),
  'user-save': el => saveUser(el.dataset.id),
  'set-save': () => saveSettings(),
  backup: async () => {
    const users = {}; Object.values(S.users).forEach(u => { users[u.id] = { id: u.id, nama: u.nama, role: u.role, aktif: u.aktif }; });
    const data = JSON.stringify({ dibuat: new Date().toISOString(), pengaturan: S.settings, pengguna: users, produk: S.products, bahan: S.bahan, penjualan: S.days }, null, 1);
    try { await S.dl.save({ filename: 'kasirku-cadangan-' + TODAY + '.json', data }); } catch (e) { if (!e || e.code !== 'declined') toast('Gagal mengunduh cadangan', 'err'); }
  },
  'demo-load': async () => {
    const staff = Object.values(S.users).filter(u => u.aktif); S.busy = 'Menyiapkan data contoh…'; render();
    try { await seedDemo(staff, m => { S.busy = m; const e = $('#busyMsg'); if (e) e.textContent = m; }); toast('Data contoh ditambahkan'); }
    catch (e) { toast('Data contoh gagal dimuat sepenuhnya', 'err'); }
    S.busy = ''; derive(); render();
  },
  'wipe-ask': el => wipeModal(el.dataset.w),
  'wipe-do': el => doWipe(el.dataset.w)
};
document.addEventListener('click', e => {
  const ov = e.target.closest('.ov'); if (ov && e.target === ov) { H.close(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.classList.contains('ov')) return;
  const f = H[el.dataset.act]; if (f) f(el, e);
});
function onIn(el) {
  const k = el.dataset.in, v = el.value, u = S.ui;
  switch (k) {
    case 'q': S.q = v; posGrid(); break;
    case 'disc': S.pay.diskonV = v; posSum(); break;
    case 'bayar': S.pay.bayar = v; posSum(); break;
    case 'sf': u.sf = v || TODAY; salesBody(); break;
    case 'st': u.st = v || TODAY; salesBody(); break;
    case 'sm': u.sm = v; salesBody(); break;
    case 'sk': u.sk = v; salesBody(); break;
    case 'ss': u.ss = v; salesBody(); break;
    case 'sq': u.sq = v; salesBody(); break;
    case 'rdate': if (v && v !== u.date) { u.date = v; renderViewKeep(); } break;
    case 'rsort': u.sort = v; repBody(); break;
    case 'pq': S.prodQ = v; prodBody(); break;
    case 'pf': calcBox(); break;
    case 'wa': { const a = $('#wa-link'); if (a && S.rcTrx) a.href = waURL(S.rcTrx, v); break; }
    case 'pfile': if (el.files && el.files[0]) fileToDataURL(el.files[0], 480, 0.78).then(d => { M.img = d; $('#pimg').src = d; }).catch(() => toast('Foto tidak bisa dibaca', 'err')); break;
    case 'logofile': if (el.files && el.files[0]) fileToDataURL(el.files[0], 256, 0.92, true).then(async d => { try { await DB.doc('img/logo').set({ d }); toast('Logo disimpan'); renderShell(); } catch (e) { toast('Gagal menyimpan logo', 'err'); } }).catch(() => toast('Logo tidak bisa dibaca', 'err')); break;
    case 'ptrack': $('#secStok').hidden = !el.checked; break;
    case 'rb': M.resep[+el.dataset.i].b = v; renderResep(); calcBox(); break;
    case 'rq': { const i = +el.dataset.i; M.resep[i].q = v; const b = S.bahan[M.resep[i].b]; const s = $('#rs' + i); if (s) s.textContent = b ? rp((+v || 0) * b.harga) : '-'; calcBox(); break; }
  }
}
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.in && el.tagName !== 'SELECT' && el.type !== 'date') onIn(el); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.in && (el.tagName === 'SELECT' || el.type === 'date' || el.type === 'checkbox' || el.type === 'file')) onIn(el); });
document.addEventListener('submit', e => { if (e.target.id === 'lg-form') { e.preventDefault(); doLogin(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').firstChild) { closeModal(); return; }
});
const tipEl = () => $('#tip');
function showTip(e) {
  const t = e.target.closest && e.target.closest('[data-tip]'); const tip = tipEl();
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, x = Math.min(window.innerWidth - w - 8, Math.max(8, e.clientX + 14));
  tip.style.left = x + 'px'; tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 12) + 'px';
}
document.addEventListener('pointermove', showTip);
document.addEventListener('pointerdown', showTip);
document.addEventListener('scroll', () => { tipEl().hidden = true; }, true);

/* ---------- siklus data & login ---------- */
function renderViewKeep() {
  const v = $('#view'); if (!v) { render(); return; }
  const st = v.scrollTop; renderView(); v.scrollTop = st;
}
let rafId = 0, unsubs = [], privBound = false, ownUnsub = null, listUnsub = null;
function checkData() { if (privBound && !S.dataReady && ['p', 'b', 's', 'u'].every(k => S.loaded[k])) S.dataReady = true; }
function refresh() {
  if (rafId) return;
  rafId = requestAnimationFrame(() => {
    rafId = 0; if (!S.ready) return;
    derive(); checkData(); if (S.busy) return;
    if (!S.me || !S.dataReady || !$('#view')) { render(); return; }
    if (S.route === 'pos') { posGrid(); posCart(); return; }
    if (!$('#modal').firstChild) renderViewKeep();
  });
}
function bindPrivate() {
  if (privBound) return; privBound = true; S.loaded = {};
  const ok = k => { S.loaded[k] = 1; };
  const bad = k => () => { S.loaded[k] = 1; toast('Sebagian data tidak bisa dibaca. Periksa aturan keamanan Firestore.', 'err'); refresh(); };
  unsubs.push(DB.doc('master/products').onSnapshot(s => { S.products = (s.data() || {}).items || {}; ok('p'); refresh(); }, bad('p')));
  unsubs.push(DB.doc('master/bahan').onSnapshot(s => { S.bahan = (s.data() || {}).items || {}; ok('b'); refresh(); }, bad('b')));
  unsubs.push(DB.collection('profiles').onSnapshot(q => { const m = {}; q.docs.forEach(x => { const d = x.data(); if (d) m[x.id] = d; }); S.users = m; ok('u'); refresh(); }, bad('u')));
  unsubs.push(DB.collection('sales').onSnapshot(q => { const d = {}; q.docs.forEach(x => { d[x.id] = (x.data() || {}).trx || {}; }); S.days = d; ok('s'); refresh(); }, bad('s')));
  unsubs.push(DB.collection('img').onSnapshot(q => { const m = {}; q.docs.forEach(x => { const d = (x.data() || {}).d; if (d) m[x.id] = d; }); S.img = m; refresh(); }, () => {}));
}
function unbindPrivate() {
  unsubs.forEach(f => { try { f(); } catch (e) { /* ignore */ } }); unsubs = []; privBound = false;
  if (ownUnsub) { ownUnsub(); ownUnsub = null; }
  Object.assign(S, { products: {}, bahan: {}, users: {}, days: {}, all: [], stock: {}, loaded: {}, dataReady: false, own: undefined, ownerExists: undefined, me: null, cart: [] });
}
function onAuth(user) {
  unbindPrivate(); S.authUser = user || null; S.ready = true;
  if (user) {
    DB.doc('meta/owner').get().then(s => { S.ownerExists = s.exists; refresh(); }).catch(() => { S.ownerExists = true; refresh(); });
    ownUnsub = DB.doc('profiles/' + user.uid).onSnapshot(s => {
      S.own = s.exists ? s.data() : null;
      if (S.own && S.own.aktif) bindPrivate();
      refresh();
    }, () => { S.own = null; refresh(); });
  }
  refresh();
}
function bindPublic() {
  DB.doc('master/settings').onSnapshot(s => { S.settings = s.data() || {}; applyBrand(); refresh(); }, () => {});
  DB.doc('img/logo').onSnapshot(s => { const d = s.exists ? (s.data() || {}).d : null; if (d) S.img.logo = d; else delete S.img.logo; refresh(); }, () => {});
}
function init() {
  render();
  if (!window.firebase) { root().innerHTML = splash('Tidak bisa memuat Firebase. Periksa koneksi internet lalu muat ulang halaman.'); return; }
  const app = firebase.initializeApp(FB_CONFIG); AUTH = firebase.auth(); FBDB = firebase.firestore();
  try { FBDB.settings({ ignoreUndefinedProperties: true }); } catch (e) { /* ignore */ }
  FBDB.enablePersistence({ synchronizeTabs: true }).catch(() => { /* tab lain atau browser tidak mendukung */ });
  DB = makeFbDB(FBDB); bindPublic();
  AUTH.onAuthStateChanged(onAuth);
}
init();

</script>
